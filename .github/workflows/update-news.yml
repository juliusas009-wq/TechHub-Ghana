name: Update TechHub Ghana News

on:
  workflow_dispatch: {}
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch latest technology news
        run: |
          python - <<'PY'
          import json
          import urllib.request
          import xml.etree.ElementTree as ET
          from datetime import datetime, timezone

          feeds = [
              ("TechCrunch", "https://techcrunch.com/feed/"),
              ("The Verge", "https://www.theverge.com/rss/index.xml"),
              ("MIT Technology Review", "https://www.technologyreview.com/feed/")
          ]

          articles = []

          def get_text(item, tag):
              element = item.find(tag)

              if element is not None and element.text:
                  return element.text.strip()

              return ""

          def detect_category(title, description):
              text = (title + " " + description).lower()

              if any(word in text for word in [
                  "artificial intelligence",
                  "machine learning",
                  "chatgpt",
                  "openai",
                  "gemini",
                  "copilot"
              ]):
                  return "Artificial Intelligence"

              if any(word in text for word in [
                  "cybersecurity",
                  "cyber security",
                  "malware",
                  "ransomware",
                  "phishing",
                  "hacking"
              ]):
                  return "Cybersecurity"

              if any(word in text for word in [
                  "programming",
                  "python",
                  "javascript",
                  "coding",
                  "developer",
                  "github"
              ]):
                  return "Programming"

              if any(word in text for word in [
                  "cloud computing",
                  "aws",
                  "azure",
                  "google cloud"
              ]):
                  return "Cloud Computing"

              if any(word in text for word in [
                  "ghana",
                  "accra",
                  "mtn ghana",
                  "telecel ghana",
                  "fintech ghana"
              ]):
                  return "Ghana Technology"

              return "Technology"

          for source, url in feeds:
              try:
                  request = urllib.request.Request(
                      url,
                      headers={
                          "User-Agent": "TechHub-Ghana-News/1.0"
                      }
                  )

                  with urllib.request.urlopen(
                      request,
                      timeout=20
                  ) as response:
                      data = response.read()

                  root = ET.fromstring(data)

                  for item in root.findall(".//item")[:20]:
                      title = get_text(item, "title")
                      link = get_text(item, "link")
                      description = get_text(item, "description")
                      date = get_text(item, "pubDate")

                      if not title or not link:
                          continue

                      articles.append({
                          "title": title,
                          "summary": description,
                          "link": link,
                          "date": date,
                          "source": source,
                          "category": detect_category(
                              title,
                              description
                          )
                      })

              except Exception as error:
                  print(
                      f"Could not load {source}: {error}"
                  )

          unique = {}

          for article in articles:
              unique[article["link"]] = article

          articles = list(unique.values())

          output = {
              "updated": datetime.now(
                  timezone.utc
              ).isoformat(),

              "articles": articles[:50]
          }

          with open(
              "news.json",
              "w",
              encoding="utf-8"
          ) as file:
              json.dump(
                  output,
                  file,
                  ensure_ascii=False,
                  indent=2
              )

          print(
              f"Saved {len(articles)} articles."
          )
          PY

      - name: Commit updated news
        run: |
          git config user.name "TechHub Ghana News Bot"
          git config user.email "actions@github.com"

          git add news.json

          if git diff --cached --quiet; then
            echo "No news changes."
          else
            git commit -m "Update latest technology news"
            git push
          fi
