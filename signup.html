<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Signup | TechHub Ghana</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


<header class="main-header">

    <div class="top-bar">

        <a href="index.html" class="logo">

            <img
                src="images/logo.png"
                alt="TechHub Ghana Logo"
            >

            <div class="logo-text">

                <h1>
                    TechHub Ghana
                </h1>

                <p>
                    Technology • Learning • Innovation
                </p>

            </div>

        </a>


        <div class="search-box">

            <input
                type="search"
                id="siteSearch"
                placeholder="Search TechHub Ghana..."
            >

            <button
                type="button"
                id="searchBtn"
            >
                🔍
            </button>

        </div>


        <button
            type="button"
            id="darkModeBtn"
        >
            🌙
        </button>

    </div>


    <button
        type="button"
        class="menu-btn"
        id="menuBtn"
        aria-expanded="false"
    >
        ☰
    </button>


    <nav id="navMenu">

        <a href="index.html">
            Home
        </a>

        <a href="ghana-tech.html">
            🇬🇭 Ghana Tech
        </a>

        <a href="news.html">
            News
        </a>

        <a href="tutorials.html">
            Tutorials
        </a>

        <a href="tools.html">
            Tools
        </a>

        <a href="gpa.html">
            GPA
        </a>

        <a href="qr-generator.html">
            QR Generator
        </a>

        <a href="ai-assistant.html">
            AI Assistant
        </a>

        <a href="about.html">
            About
        </a>

        <a href="contact.html">
            Contact
        </a>

    </nav>

</header>


<section class="login-section">

    <div class="login-box">

        <h2>
            Create Account
        </h2>

        <p>
            Join TechHub Ghana today.
        </p>


        <form id="signupForm">


            <label for="username">
                Full Name
            </label>

            <input
                type="text"
                id="username"
                placeholder="Enter your name"
                required
            >


            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >


            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Create password"
                minlength="6"
                required
            >


            <button type="submit">
                Create Account
            </button>

        </form>


        <p style="margin-top:20px;">

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </p>

    </div>

</section>


<footer>

    <p class="copyright">
        © 2026 TechHub Ghana. All Rights Reserved.
    </p>

</footer>


<script src="script.js"></script>


<script>

document.addEventListener(
    "DOMContentLoaded",
    function () {

        const form =
            document.getElementById(
                "signupForm"
            );


        form.addEventListener(
            "submit",
            function (event) {

                event.preventDefault();


                const username =
                    document.getElementById(
                        "username"
                    ).value.trim();


                const email =
                    document.getElementById(
                        "email"
                    ).value.trim();


                const password =
                    document.getElementById(
                        "password"
                    ).value;


                if (
                    !username ||
                    !email ||
                    !password
                ) {

                    alert(
                        "Please complete all fields."
                    );

                    return;

                }


                if (password.length < 6) {

                    alert(
                        "Password must contain at least 6 characters."
                    );

                    return;

                }


                const users =
                    JSON.parse(
                        localStorage.getItem(
                            "techhubUsers"
                        )
                    ) || [];


                const exists =
                    users.some(
                        function (user) {

                            return (
                                user.email.toLowerCase() ===
                                email.toLowerCase()
                            );

                        }
                    );


                if (exists) {

                    alert(
                        "An account with this email already exists."
                    );

                    return;

                }


                users.push({

                    username: username,

                    email: email,

                    password: password

                });


                localStorage.setItem(
                    "techhubUsers",
                    JSON.stringify(users)
                );


                alert(
                    "Account created successfully! 🎉"
                );


                window.location.href =
                    "login.html";

            }
        );

    }
);

</script>


</body>
</html>
