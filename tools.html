<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>QR Code Generator | TechHub Ghana</title>

    <meta
        name="description"
        content="Free QR Code Generator from TechHub Ghana."
    >

    <link rel="stylesheet" href="style.css">

</head>


<body>


<header class="main-header">

    <div class="top-bar">

        <a href="index.html" class="logo">

            <img
                src="images/logo.png"
                alt="TechHub Ghana Logo"
            >

            <div class="logo-text">

                <h1>TechHub Ghana</h1>

                <p>
                    Technology • Learning • Innovation
                </p>

            </div>

        </a>


        <div class="search-box">

            <input
                type="search"
                id="siteSearch"
                placeholder="Search TechHub Ghana..."
            >

            <button
                type="button"
                id="searchBtn"
            >
                🔍
            </button>

        </div>


        <button
            type="button"
            id="darkModeBtn"
        >
            🌙
        </button>

    </div>


    <button
        type="button"
        class="menu-btn"
        id="menuBtn"
        aria-expanded="false"
    >
        ☰
    </button>


    <nav id="navMenu">

        <a href="index.html">
            Home
        </a>

        <a href="ghana-tech.html">
            🇬🇭 Ghana Tech
        </a>

        <a href="news.html">
            News
        </a>

        <a href="tutorials.html">
            Tutorials
        </a>

        <a href="tools.html">
            Tools
        </a>

        <a href="gpa.html">
            GPA
        </a>

        <a
            href="qr-generator.html"
            class="active"
        >
            QR Generator
        </a>

        <a href="ai-assistant.html">
            AI Assistant
        </a>

        <a href="about.html">
            About
        </a>

        <a href="contact.html">
            Contact
        </a>

    </nav>

</header>


<section class="section">

    <div class="article-page">

        <h1>
            🔳 QR Code Generator
        </h1>

        <p>
            Enter a website link, text, email address
            or phone number.
        </p>


        <input
            type="text"
            id="qrText"
            placeholder="https://example.com"
            style="
                width:100%;
                padding:14px;
                margin:20px 0;
                border:1px solid #d9dee7;
                border-radius:8px;
                outline:none;
            "
        >


        <button
            type="button"
            id="generateQRBtn"
            class="read-btn"
        >
            Generate QR Code
        </button>


        <div
            id="qrcode"
            style="
                margin-top:30px;
                text-align:center;
            "
        ></div>

    </div>

</section>


<footer>

    <p class="copyright">
        © 2026 TechHub Ghana. All Rights Reserved.
    </p>

</footer>


<script src="script.js"></script>


<script>

document.addEventListener(
    "DOMContentLoaded",
    function () {

        const input =
            document.getElementById("qrText");

        const button =
            document.getElementById(
                "generateQRBtn"
            );

        const qr =
            document.getElementById("qrcode");


        button.addEventListener(
            "click",
            function () {

                const text =
                    input.value.trim();


                if (!text) {

                    alert(
                        "Please enter text or a URL."
                    );

                    input.focus();

                    return;

                }


                qr.innerHTML = `

                    <img
                        src="https://api.qrserver.com/v1/create-qr-code/?data=${encodeURIComponent(text)}&size=250x250"
                        alt="Generated QR Code"
                        width="250"
                        height="250"
                    >

                `;

            }
        );

    }
);

</script>


</body>
</html>
